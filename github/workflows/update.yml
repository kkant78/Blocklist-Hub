name: Update blocklists
on:
  schedule:
    - cron: "30 2 * * *"      # roz 02:30 UTC = 08:00 IST
  workflow_dispatch:
  push:
    paths: [sources.toml, build.py, "allowlist/**", "custom/**"]
permissions:
  contents: write
concurrency:
  group: update-lists
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "blocklist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update lists $(date -u '+%F %H:%M')"
            git push
          fi
