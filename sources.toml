# Priority = categories ka order (upar wali category ko domain pehle milta hai -> repetition nahi).
#
# Do tarah ki categories:
#  1) Tiered  : small / medium / large  (har tier pichhle tier ke upar jodta hai, cumulative)
#               -> lists/<naam>.small.txt, <naam>.medium.txt, <naam>.large.txt
#               Jis tier me koi source nahi likha, uski file nahi banti.
#  2) Single  : sirf  urls = [...]  -> lists/<naam>.txt
#
# in_universal = true  -> lists/universal.<tier>.txt me shamil, aur INDEX.md me ON suggest hoti hai.
# Koi source fail/404 ho to build use skip karke log me dikhata hai.

[categories.custom]
description = "Meri apni block list (custom/block.txt)"
in_universal = true
files = ["custom/block.txt"]

[categories.malware]
description = "Malware, botnet C2, threat intelligence"
in_universal = true
small = [
  "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.mini.txt",
]
medium = [
  "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.medium.txt",
]
large = [
  "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.txt",
  "https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt",
  "https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt",
]

[categories.phishing]
description = "Phishing domains (small me nahi: malware tier ki TIF list me already aate hain)"
in_universal = true
medium = [
  "https://phishing.army/download/phishing_army_blocklist_extended.txt",
]
large = [
  "https://raw.githubusercontent.com/mitchellkrogza/Phishing.Database/master/phishing-domains-ACTIVE.txt",
]

[categories.scam]
description = "Scam, fraud, spam, fake shops"
