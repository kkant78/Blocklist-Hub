# Priority = order of categories in this file.
# Ek domain sirf pehli (highest-priority) category me jaata hai -> koi repetition nahi.
# in_universal = true  -> lists/universal.txt me shamil, aur lists/INDEX.md me 'ON' suggest hoti hai
# Har category ki apni alag file hai (lists/<naam>.txt) - jo chahiye wahi AdGuard Home me ON rakhein.
# Koi source fail/404 ho to build use skip karke log me dikhata hai.

[categories.custom]
description = "Meri apni block list (custom/block.txt)"
in_universal = true
files = ["custom/block.txt"]

[categories.malware]
description = "Malware, botnet C2, threat intelligence"
in_universal = true
urls = [
  "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/tif.medium.txt",
  "https://urlhaus.abuse.ch/downloads/hostfile/",
  "https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt",
  "https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt",
]

[categories.phishing]
description = "Phishing domains"
in_universal = true
urls = [
  "https://raw.githubusercontent.com/mitchellkrogza/Phishing.Database/master/phishing-domains-ACTIVE.txt",
  "https://phishing.army/download/phishing_army_blocklist_extended.txt",
]

[categories.scam]
